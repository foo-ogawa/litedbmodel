# SDK-baseline ORM-bench cell (#129) — a raw database-driver implementation of the same 19 ORM ops,
# hand-written against the plain drivers (rusqlite for sqlite; the `postgres` + `mysql` crates behind the
# `livedb` feature) WITHOUT going through litedbmodel at all. It is the deliberate comparison cell for the
# collector's `sdk` vs `native` latency delta, so it depends on NEITHER litedbmodel_runtime NOR
# behavior-contracts. It preserves the SDK-side CLI / CSV schema / op list / seed independently of
# the native cell, whose implementation must be generated by BC from the TypeScript leaf graph.
#
# A STANDALONE crate (its own `[workspace]`) so it never perturbs the conformance bar's build/lock.
[workspace]

[package]
name = "orm_bench_sdk"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "orm_bench_sdk"
path = "src/main.rs"

[dependencies]
# The shared bench setup (seed SSoT + TEST_*-env connection targets), also consumed by the native
# cell — see rust/orm_bench_common. Depends on serde_json only, so the raw-driver baseline stays free
# of litedbmodel_runtime (#157 invariant 6).
orm_bench_common = { path = "../orm_bench_common" }
rusqlite = { version = "0.31", features = ["bundled"] }
# Read the ONE seed SSoT (`benchmark/crosslang/.setup/<dialect>.json`, emitted from orm-domain.ts) at
# runtime — same fixture the native twin loads. serde_json is a bench-only dep.
serde_json = "1"

# `livedb` (opt-in): the same 19 ops against docker Postgres / MySQL via the plain `postgres` + `mysql`
# crates. The default (SQLite) build needs neither.
# `with-serde_json-1`: the generated PostgreSQL composite-key predicate binds its key set to a
# `?::json` param, and the crate maps types strictly — a `String` cannot be sent for `json`.
# `with-chrono-0_4`: a TIMESTAMP column must de-box to the SAME canonical `YYYY-MM-DD HH:MM:SS` String
# the native cell produces (rust/litedbmodel_runtime/src/livedb.rs:640). Reading it as a `SystemTime` and
# dropping it, which is what this cell did, skipped the parse + format + String allocation the native path
# pays on every row of `findAll`/`filterPaginateSort` — the baseline doing LESS work than what it baselines.
postgres = { version = "0.19", optional = true, features = ["with-serde_json-1", "with-chrono-0_4"] }
chrono = { version = "0.4", optional = true, default-features = false }
# `ToSql` hands the encoder a `BytesMut`, so the pg integer bind (PgInt, main.rs) needs the same
# `bytes` postgres itself uses. Already in the lock as postgres' transitive dep — a pin, not a new dep.
bytes = { version = "1", optional = true }
mysql = { version = "25", optional = true }

[features]
default = []
livedb = ["dep:postgres", "dep:mysql", "dep:bytes", "dep:chrono"]

[profile.release]
opt-level = 3
lto = true
