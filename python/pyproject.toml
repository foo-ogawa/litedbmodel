[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litedbmodel-runtime"
version = "2.3.1"
description = "litedbmodel v2 SCP Python runtime: the op-agnostic leaf transports, execution context, drivers and relation grouping that the bc python-native modules call."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "foo-ogawa" }]
keywords = ["orm", "sql", "ir", "runtime", "conformance", "litedbmodel"]

# No runtime dependency: a bc python-native module carries its plan, expressions and de-box itself and
# imports only this package's leaf transports.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
# WS7g (#36) live-DB conformance drivers (from PyPI — NO local path). Installed only for the
# coordinated cross-language live-PG/MySQL pass (livedb_runner.py); the SQLite conformance bar
# never needs them (the driver module imports psycopg / pymysql lazily inside connect()).
livedb = ["psycopg[binary]>=3.1", "pymysql>=1.1.1"]

[tool.setuptools]
packages = ["litedbmodel_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
