name: npm audit remediate

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: npm-audit-remediate
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install current lockfile
        run: npm ci --ignore-scripts
      - name: Audit every dependency graph in the repository
        id: audit
        continue-on-error: true
        # The root lockfile is audited as installed; the rest are read from disk, since a
        # tooling or example tree is not worth an install to look at. `git ls-files` keeps the
        # set in step with the repository — a hand-written list goes stale the day someone adds
        # a lockfile, which is exactly how these trees went unaudited in the first place.
        run: |
          status=0
          npm audit --audit-level=moderate || status=1
          for lock in $(git ls-files '*/package-lock.json'); do
            ( cd "$(dirname "$lock")" && npm audit --package-lock-only --audit-level=moderate ) || status=1
          done
          exit $status
      - name: Stop if clean
        if: steps.audit.outcome == 'success'
        run: echo "npm audit passed. No remediation PR needed."
      - name: Apply lockfile-only audit fix
        if: steps.audit.outcome == 'failure'
        # `npm audit fix` exits 1 whenever any vulnerability remains, at any
        # severity, so its exit code carries a stricter threshold than this
        # workflow's gate. The updated lockfile is judged by the gate threshold.
        #
        # One pass does not converge — five advisories survived the first call and cleared on
        # the second — so run to a fixed point. The audit after it is the gate, and it is not
        # allowed to fail: a tree that cannot be fixed lockfile-only stops the workflow here
        # rather than reaching the branch half-remediated.
        run: |
          fix_here() {
            for _ in 1 2 3 4 5; do
              before=$(git hash-object package-lock.json)
              npm audit fix --package-lock-only --ignore-scripts || true
              if [ "$(git hash-object package-lock.json)" = "$before" ]; then break; fi
            done
          }
          fix_here
          npm audit --package-lock-only --audit-level=moderate
          for lock in $(git ls-files '*/package-lock.json'); do
            ( cd "$(dirname "$lock")" && fix_here && npm audit --package-lock-only --audit-level=moderate )
          done
      - name: Reject package.json changes
        if: steps.audit.outcome == 'failure'
        run: git diff --exit-code -- '*package.json'
      - name: Stop if lockfile did not change
        if: steps.audit.outcome == 'failure'
        id: diff
        continue-on-error: true
        run: git diff --exit-code -- '*package-lock.json'
      - name: Install updated lockfile
        if: steps.audit.outcome == 'failure' && steps.diff.outcome == 'failure'
        run: npm ci --ignore-scripts
      - name: Verify audit is clean
        if: steps.audit.outcome == 'failure' && steps.diff.outcome == 'failure'
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        if: steps.audit.outcome == 'failure' && steps.diff.outcome == 'failure'
        run: npm audit signatures
      - name: Lint
        if: steps.audit.outcome == 'failure' && steps.diff.outcome == 'failure'
        run: npm run lint --if-present
      - name: Build
        if: steps.audit.outcome == 'failure' && steps.diff.outcome == 'failure'
        run: npm run build
      - name: Verify package contents
        if: steps.audit.outcome == 'failure' && steps.diff.outcome == 'failure'
        run: npm pack --dry-run
      - name: Push the remediation branch and report it
        if: steps.audit.outcome == 'failure' && steps.diff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: security/npm-audit-lockfile-fix
          ISSUE_TITLE: "security: an npm audit lockfile fix is waiting for a pull request"
          ISSUE_BODY: |
            `security/npm-audit-lockfile-fix` carries a lockfile-only npm audit fix produced by the controlled remediation workflow. It always holds the current fix. Open the pull request to put it through CI:

            ```
            gh pr create --base main --head security/npm-audit-lockfile-fix --title "security: apply npm audit lockfile fix"
            ```

            Scope:
            - Triggered only because npm audit detected vulnerabilities
            - Updated package-lock.json only
            - package.json changes are rejected
            - npm install scripts are disabled
            - npm audit, npm audit signatures, lint, build, test, and npm pack --dry-run passed

            Policy:
            - Dependabot version updates are not used
            - Auto-merge is prohibited
            - The pull request must pass the normal CI gate before merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- '*package-lock.json'
          git commit -m "security: apply npm audit lockfile fix"
          git push --force-with-lease origin "$BRANCH"

          # github.token cannot open a pull request. That requires "Allow GitHub
          # Actions to create and approve pull requests", which would also let a
          # workflow approve one and satisfy main's required review on its own.
          # An issue reaches the same review queue without widening that.
          if gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "An open issue already points at $BRANCH, which now holds the current fix."
            exit 0
          fi
          printf '%s\nRun: %s/%s/actions/runs/%s\n' \
            "$ISSUE_BODY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/issue-body.md"
          gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
