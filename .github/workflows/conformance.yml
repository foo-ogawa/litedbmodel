name: Conformance & Release Discipline

# WS7a (#30) skeleton — the multi-language conformance LOCK + release-discipline gates for the
# litedbmodel v2 SCP §8 artifact. WS7b-e extend the `langs` matrix with the real per-language
# runtime builds + vector runners; WS7a wires the TS reference leg + the version/no-local-deps
# gates + the scaffold build checks so every language skeleton stays buildable.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Release discipline: version SSoT + no escaping local deps ───────────────
  release-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+: scripts/check-no-local-deps.mjs uses `globSync` from
          # `node:fs`, which is only exported from Node 22 onward (Node 20 throws
          # `SyntaxError: … does not provide an export named 'globSync'`). Matches
          # the local dev floor (Node 22+) and graphddb's CI (node-version: 22).
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Version SSoT in lockstep (npm → PyPI/crates/Go-tag/Packagist)
        run: npm run sync:versions:check
      - name: No local (../-escaping) dependencies
        run: npm run deps:check
      # A TRACKED file is invisible to BOTH `git status` and .gitignore, which is how a 0-byte file whose
      # name was a psql connection string, 27 MB of cargo build cache and two 20 MB Mach-O binaries all
      # sat in the index unnoticed (#203).
      - name: The index holds only files someone meant to commit
        run: npm run tracked:check
      - name: Every test gate is reachable from CI
        run: npm run gates:check
      - name: The published package actually loads (CJS + ESM, clean install)
        run: |
          npm run build
          npm run pkg:check

  # ── TS conformance: the corpus is byte-true to the pipeline and every vector passes ──
  # `test/scp/conformance-vectors.test.ts` regenerates the corpus and diffs it (drift gate), then
  # runs EVERY vector through the TS reference. The cross-LANGUAGE legs live in conformance-livedb
  # below, which executes the same declarations on real PG + MySQL.
  conformance-ts:
    runs-on: ubuntu-latest
    # The TS reference runner executes every vector on SQLite AND live PostgreSQL + MySQL (the harness
    # connects to TEST_DB_*/TEST_MYSQL_* with no skip), so provision the same DB stack conformance-livedb
    # uses — otherwise the live-DB exec vectors fail to connect instead of running.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 2s --health-timeout 5s --health-retries 15
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpass"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5433"
      TEST_MYSQL_HOST: "127.0.0.1"
      TEST_MYSQL_PORT: "3307"
      GOPRIVATE: github.com/foo-ogawa/behavior-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum
      - name: Auth for the private behavior-contracts Go VCS-tag dependency
        env:
          BEHAVIOR_CONTRACTS_PAT: ${{ secrets.BEHAVIOR_CONTRACTS_PAT }}
        run: |
          git config --global url."https://x-access-token:${BEHAVIOR_CONTRACTS_PAT}@github.com/foo-ogawa/behavior-contracts".insteadOf "https://github.com/foo-ogawa/behavior-contracts"
      - name: Warm private go module graph (retry transient auth)
        uses: ./.github/actions/warm-go-module
      - run: npm ci --ignore-scripts
      # The python vectors runner + the codegen py-exec leg import litedbmodel_runtime, which
      # consumes the shared behavior-contracts core — install both the local runtime package and
      # the published bc core so `python3` legs run instead of exiting 1 with an ImportError.
      - name: Install the Python runtime + behavior-contracts core (for the py legs)
        # `./python`'s pyproject pins `behavior-contracts==0.8.0` as a hard dep, so this pulls the
        # bc core too. Without it the py vectors runner + codegen py-exec exit 1 on ImportError.
        run: python3 -m pip install ./python
      # The repo `.npmrc` sets `ignore-scripts=true`, so `npm ci` skips
      # better-sqlite3's native `install` script and its `better_sqlite3.node`
      # addon is never built. The conformance harness opens an in-memory SQLite
      # (`new Database(':memory:')`) to execute vectors. NOTE: a bare
      # `npm rebuild better-sqlite3` ALSO honours ignore-scripts and prints
      # "rebuilt dependencies successfully" WITHOUT building the addon — the
      # per-command `ignore-scripts=false` override is required to run the
      # install script (prebuild-install fast path) and actually produce the
      # `.node`. Fall back to a from-source node-gyp build if no prebuild exists.
      - name: Build the better-sqlite3 native addon (skipped by ignore-scripts)
        run: npm_config_ignore_scripts=false npm rebuild better-sqlite3 --build-from-source=false || (cd node_modules/better-sqlite3 && npx node-gyp rebuild --release)
      - name: Build the SCP dist artifact (consumed by the vectors runner)
        run: npm run build:scp
      - name: Corpus drift gate + TS reference runner (part of the suite)
        run: npx vitest run test/scp/conformance-vectors.test.ts

  # ── Language scaffolds stay buildable (WS7b-e fill in the runtime bodies) ───
  scaffold-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [python, go, rust, php]
    steps:
      - uses: actions/checkout@v4
      - name: Python — package imports
        if: matrix.lang == 'python'
        run: |
          python3 -m py_compile python/litedbmodel_runtime/*.py
      - name: Go — setup
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          # The WS7c Go runtime consumes behavior-contracts + a pure-Go SQLite (modernc); the
          # dependency graph's `go` floors require a modern toolchain (mirrors graphddb's go leg).
          go-version: '1.25'
      # go's gofmt gate is a node script, and both the go and rust legs invoke their dispatch-coverage
      # gate through `npm run`. No `npm ci` — neither needs node_modules.
      - name: Setup node (for the go/rust gates invoked via npm)
        if: matrix.lang == 'go' || matrix.lang == 'rust'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Go — auth for the private behavior-contracts VCS-tag dependency
        if: matrix.lang == 'go'
        env:
          # behavior-contracts is a PRIVATE repo pinned by VCS tag (go/v0.2.0) — NO local replace.
          # Resolving it needs GOPRIVATE + an authenticated git rewrite. Uses the same
          # fine-grained read-only PAT graphddb stores (Contents: Read on
          # foo-ogawa/behavior-contracts) under the BEHAVIOR_CONTRACTS_PAT secret.
          BEHAVIOR_CONTRACTS_PAT: ${{ secrets.BEHAVIOR_CONTRACTS_PAT }}
        run: |
          git config --global url."https://x-access-token:${BEHAVIOR_CONTRACTS_PAT}@github.com/foo-ogawa/behavior-contracts".insteadOf "https://github.com/foo-ogawa/behavior-contracts"
          echo "GOPRIVATE=github.com/foo-ogawa/behavior-contracts" >> "$GITHUB_ENV"
          echo "GOFLAGS=-mod=mod" >> "$GITHUB_ENV"
      - name: Go — warm private module graph (retry transient auth)
        if: matrix.lang == 'go'
        uses: ./.github/actions/warm-go-module
      - name: Go — build + vet + gofmt (all packages)
        if: matrix.lang == 'go'
        # #63 cleanup: the retired codegen bench (go/lm_bench cgcell·cgplans + go/lm_codegen, which
        # imported the GITIGNORED generated cgmods/**) is DELETED, so `go build ./...` / `go vet ./...`
        # now walk every committed package cleanly — including the #63 ORM-plan executor
        # (go/lm_bench/lm_orm), a self-contained package with no generated-artifact dependency.
        #
        # gofmt (#204): rust has had `cargo fmt --check` since #168; go had nothing, and gofmt affects
        # neither the build nor vet nor the tests, so four hand-written files stayed unformatted with no
        # symptom at all. The gate is a script rather than a bare `gofmt -l` because the bc-GENERATED
        # modules must be EXEMPT — bc's go output is not gofmt-clean and is byte-compared against a
        # fresh generation, so `gofmt -w` on one produces `bc: DRIFT` (measured). It checks that
        # exemption BOTH WAYS against the files' own bc marker, so a hand-written file cannot hide in it
        # and a newly generated module cannot go unlisted. `gofmt -l` also exits 0 whatever it finds, so
        # a bare invocation would need `[ -z "$(...)" ]` and would call a gofmt CRASH clean.
        #
        # `go:dispatch:check` (#222): the runner's endpoint table must cover every entry the live-DB
        # corpus uses. It asserts that from the REAL `dispatch` map, before opening a connection, so it
        # needs no database — and it replaces a static scanner that read the source as text and was
        # fooled twice by comment and string syntax it did not model (#201).
        run: |
          (cd go && go build ./... && go vet ./...)
          npm run go:fmt:check
          npm run go:dispatch:check
      - name: Rust — check (--locked) + fmt + clippy (runtime AND the livedb runner)
        if: matrix.lang == 'rust'
        # No workflow ran `cargo fmt --check` or clippy, so both drifted unnoticed (#168). They gate
        # here, on the leg that already owns "the rust scaffold stays buildable".
        #
        # `--locked` (#197): without it cargo SILENTLY rewrites a stale Cargo.lock and goes green, so a
        # version bump that missed the lock — 2.2.1 — was invisible until a clean tree came back dirty
        # from running the suite. Now the stale lock fails the job instead of being repaired in place.
        #
        # `-p livedb_runner --features livedb` (#201): the runner is NOT a default-member and its
        # bc-generated modules are behind that feature, so NOTHING here compiled them. Adding a
        # conformance endpoint means hand-following the entry switch AND an `impl_to_compare!` per
        # outType in both dialect modules; a missed one is a trait-bound error that used to appear only
        # in the live-DB leg, after docker was up and py/php/go had run. Measured with one
        # `impl_to_compare!(pg::PagedFeedRow …)` removed: `cargo check` exit 0, `cargo clippy
        # --workspace --all-targets -- -D warnings` exit 0 (it compiles the crate WITHOUT the feature,
        # so the generated tree is not in the build at all), this line exit 101 with E0599 — in 51s,
        # no database.
        #
        # `rust:dispatch:check` (#222) rides here because this leg ALREADY builds livedb_runner with
        # `--features livedb` for the clippy line above, so running it costs no extra compile. It asserts
        # from the REAL `DISPATCH` table that the endpoint set covers the live-DB corpus, before any
        # driver connects — no database — replacing a static scanner that read the source as text and was
        # fooled twice by syntax it did not model (#201).
        run: |
          cd rust
          cargo fmt --all -- --check
          cargo check --locked
          cargo clippy -p litedbmodel_runtime --features livedb --all-targets -- -D warnings
          cargo clippy -p livedb_runner --features livedb --all-targets -- -D warnings
          cd .. && npm run rust:dispatch:check
      - name: PHP — lint
        if: matrix.lang == 'php'
        run: |
          php -l php/src/Runtime.php
          php -l php/conformance/livedb_runner.php

  # ── WS7g (#36): coordinated cross-language LIVE-DB validation (real PG + MySQL) ──
  # Each of Python/Go/PHP/Rust runs the exec/tx bundles compiled for postgres + mysql against a
  # REAL dockerized Postgres 16 + MySQL 8 (GitHub `services:`, host-published ports), asserting the
  # assembled result equals the frozen SQLite reference (§10). NO mock, NO silent skip — a leg that
  # can't reach the DB exits 3 and fails the job. Each language isolates its tables in its own
  # namespace (scp_py / scp_go / scp_php / scp_rust) so the one stack has no cross-contamination.
  conformance-livedb:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 2s --health-timeout 5s --health-retries 15
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -prootpass"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # Host-published service ports (match docker-compose.livedb.yml + the runners' defaults).
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5433"
      TEST_MYSQL_HOST: "127.0.0.1"
      TEST_MYSQL_PORT: "3307"
      GOPRIVATE: github.com/foo-ogawa/behavior-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, pdo_mysql, mbstring
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      # `npm test` runs test/scp/native-closure.test.ts, which compiles a probe crate against
      # rust/litedbmodel_runtime under `--offline`. That resolves behavior-contracts from the cargo
      # registry cache, which nothing in this job populates — so pre-fetch the rust workspace's deps
      # (incl. the pinned behavior-contracts) ONLINE here, before the offline probe (#183).
      # `--locked` because this is the FIRST cargo command in the job: a fetch that re-resolves would
      # rewrite a stale lock in place and every later `--locked` command would then agree with it (#197).
      - name: Warm the cargo registry cache for the offline native-closure probe (#183)
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      # Create + grant the per-language `scp_%` MySQL databases from the SSoT the docker stack mounts
      # (test/fixtures/livedb-grants.sql) — the inline `services:` don't mount it, and the rust/go/py/php
      # livedb suites connect straight to scp_<lang> (which must already exist) instead of CREATE-ing it.
      - name: Create + grant the per-language `scp_%` MySQL databases
        run: mysql -h 127.0.0.1 -P 3307 -u root -prootpass < test/fixtures/livedb-grants.sql
      # The docker-compose stack mounts test/fixtures/init*.sql via docker-entrypoint-initdb.d, but the
      # inline CI `services:` do NOT — so testdb had none of the integration-test schema
      # (users/posts/tags/post_tags/all_types_test) and every `npm test` integration test failed with
      # "relation/table does not exist". Load it here, after checkout, before npm test (#184).
      - name: Load the integration-test schema into the live DBs (#184)
        run: |
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d testdb -v ON_ERROR_STOP=1 -f test/fixtures/init.sql
          mysql -h 127.0.0.1 -P 3307 -u testuser -ptestpass testdb < test/fixtures/init-mysql.sql
      - name: Auth for the private behavior-contracts Go VCS-tag dependency
        env:
          # Same fine-grained read-only PAT graphddb uses (Contents: Read on
          # foo-ogawa/behavior-contracts), stored as BEHAVIOR_CONTRACTS_PAT.
          BEHAVIOR_CONTRACTS_PAT: ${{ secrets.BEHAVIOR_CONTRACTS_PAT }}
        run: |
          git config --global url."https://x-access-token:${BEHAVIOR_CONTRACTS_PAT}@github.com/foo-ogawa/behavior-contracts".insteadOf "https://github.com/foo-ogawa/behavior-contracts"
      - name: Warm private go module graph (retry transient auth)
        uses: ./.github/actions/warm-go-module
      - name: Install Node deps + Python DB drivers + PHP deps
        run: |
          npm ci --ignore-scripts
          # `ignore-scripts=false` override is required: a bare `npm rebuild`
          # honours the repo `.npmrc` ignore-scripts and reports success WITHOUT
          # building the addon (see conformance-ts). Force the install script to
          # run so `better_sqlite3.node` is actually produced.
          npm_config_ignore_scripts=false npm rebuild better-sqlite3 --build-from-source=false || (cd node_modules/better-sqlite3 && npx node-gyp rebuild --release)
          # The behavior-contracts version is pinned by python/pyproject.toml (and package.json for
          # npm) — installing the package here rather than naming a version keeps the pin in ONE
          # place. `[livedb]` adds the psycopg/PyMySQL drivers the live legs need.
          python3 -m pip install './python[livedb,test]'
          composer -d php install
      # Open every live-DB test gate from the ONE declaration (#168). Without this the per-language
      # suites below either skip themselves or run only their offline half, and report green.
      - name: Open the live-DB test gates
        # Declaration lines only — `$GITHUB_ENV` rejects anything that is not KEY=VALUE, so the
        # comments in livedb-gates.env cannot be piped through.
        run: grep -E '^[A-Z][A-Z0-9_]*=' livedb-gates.env >> "$GITHUB_ENV"
      - name: Build the SCP dist artifact (consumed by the corpus generator)
        run: npm run build:scp
      - name: Generate the live-DB corpus (pg+mysql bundles; cross-checked vs frozen)
        run: npm run conformance:gen:livedb
      - name: Run all 4 language live-DB legs against real PG + MySQL
        run: npm run conformance:livedb
      # ── The per-language test suites (#168) ────────────────────────────────
      # `conformance:livedb` above replays the frozen corpus; these are the suites that prove the
      # runtime BEHAVIOURS around it — tx isolation levels, tx boundaries, reader/writer routing and
      # the middleware seam — against the same real PG + MySQL. They never ran in any workflow, so
      # four languages' worth of them had been green-by-default since they were written.
      # The python/php *_native suites import the ORM-bench cell, which reads benchmark/crosslang/.setup/
      # <dialect>.json at import — a GENERATED (gitignored) seed fixture. Emit it once here, or pytest
      # collection dies with FileNotFoundError (#185).
      - name: Emit the cross-lang ORM-bench seed fixture (.setup/*.json) for the native conformance suites
        run: npx tsx benchmark/crosslang/emit-setup.ts
      - name: TypeScript — full suite (unit + scp + parity + integration)
        run: npm test
      - name: Python — pytest
        run: cd python && python3 -m pytest -q
      - name: PHP — phpunit
        run: cd php && ./vendor/bin/phpunit
      # A bare `go test ./...` cannot report that its suite ran. It calls a SKIPPED test a success, it
      # replays a whole CACHED run without starting the binary (cache keyed on source and env, never
      # on whether the DB is still up), it says nothing when the set of tests SHRANK, and it prints a
      # package that failed to BUILD only into the -json stream, not stderr. Each of those was green
      # here while the sixteen live-DB legs executed nothing, which is how a named-DB transaction
      # regression reached a commit (#219). `npm run go:test` runs the same `./...` suite with
      # `-count=1` and checks the stream against the source tree: every top-level `func Test*` under
      # go/ reported a verdict, zero skips, zero unbuilt packages, the live legs still present, and
      # go's own exit code (it owns the process, so nothing here depends on the step's shell being
      # one with `pipefail`).
      - name: Go — go test (uncached; every declared test RUNS, every package BUILDS; skip budget 0)
        run: npm run go:test
      - name: Rust — cargo test (livedb)
        run: cd rust && cargo test --locked -p litedbmodel_runtime --features livedb -- --test-threads=1
