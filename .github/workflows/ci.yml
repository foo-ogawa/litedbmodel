name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 to match the local dev floor and the other workflows
          # (release-discipline needs `node:fs` globSync, Node 22+).
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Audit
        # Audit the PRODUCTION dependency tree — what actually ships in the package. Dev-only tooling
        # (typedoc / eslint and their transitive postcss / linkify-it / js-yaml / brace-expansion) is not
        # published and its advisories are handled by npm-audit-remediate.yml, so it does not gate a release.
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build
      - name: Verify package contents
        run: npm pack --dry-run

  # The benchmark docs are MACHINE-GENERATED from benchmark/results/benchmark-results.csv: the tables +
  # win count in docs/*.md via embedoc, the chart via generate-chart.ts. Nothing gated that before, so the
  # embed silently drifted from the CSV (the docs showed an older run's numbers). Regenerate and fail on any
  # diff — the published numbers must always equal the measured data, never a hand-edited figure.
  bench-docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Regenerate benchmark docs + chart from the CSV
        run: |
          npx embedoc build
          npx tsx benchmark/generate-chart.ts
      - name: Fail if docs/chart drifted from benchmark-results.csv
        run: |
          git diff --exit-code -- docs/ \
            || { echo "::error::Benchmark docs/chart are out of sync with benchmark/results/benchmark-results.csv. Run 'npx embedoc build && npx tsx benchmark/generate-chart.ts' and commit the result."; exit 1; }
