name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 to match the local dev floor and the other workflows
          # (release-discipline needs `node:fs` globSync, Node 22+).
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Audit
        # Audit the PRODUCTION dependency tree — what actually ships in the package. Dev-only tooling
        # (typedoc / eslint and their transitive postcss / linkify-it / js-yaml / brace-expansion) is not
        # published and its advisories are handled by npm-audit-remediate.yml, so it does not gate a release.
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Spec references resolve
        # docs/architecture.md is the formal spec; fail if any `symbol`/`file` it cites is gone,
        # or if a `spec §N` cited in src/** points at a section that no longer exists (#229).
        run: npm run spec:check
      - name: Build
        run: npm run build
      - name: Verify package contents
        run: npm pack --dry-run

  # Everything under docs/ that a generator owns is regenerated here and diffed, so the published files
  # always equal what their sources regenerate to: the benchmark tables + win count in docs/*.md via
  # embedoc and the chart via generate-chart.ts (both from benchmark/results/benchmark-results.csv), and
  # the API reference under docs/api/ via typedoc (from src/). Neither a hand-edited figure nor a
  # snapshot of an older release survives — docs/api/ was generated once under 1.0.1 and, with nothing
  # regenerating it, shipped v1's API reference through every v2 release (#251).
  #
  # `embedoc build` reports a failed embed load as a warning and exits 0, leaving every marker untouched,
  # so a plain regenerate-and-diff passes while the embeds never ran. check-bench-docs.mjs blanks the
  # regions first, making an unrendered one fail loudly instead of surviving into a clean diff.
  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Regenerate benchmark docs + chart from the CSV
        run: npm run docs:bench:check
      # After embedoc, not before: docs/api/README.md is a COPY of docs/api-guide.md (typedoc.json
      # `readme`), so an embed region there has to be rendered before the copy is taken.
      - name: Regenerate the API reference from src/
        run: npm run docs
      - name: Fail if docs/ drifted from their sources
        run: |
          # git diff is blind to a file a generator NEWLY created, and typedoc adds a page per new
          # export — three were untracked when #251 was found, and a diff-only check would have called
          # that tree clean. Intent-to-add puts them in the diff.
          git add --intent-to-add -- docs/
          git diff --exit-code -- docs/ \
            || { echo "::error::docs/ is out of sync with its sources (benchmark-results.csv / src). Run 'npm run docs:bench:check && npm run docs' and commit the result."; exit 1; }
