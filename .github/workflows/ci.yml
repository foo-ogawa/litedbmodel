name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 to match the local dev floor and the other workflows
          # (release-discipline needs `node:fs` globSync, Node 22+).
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Audit
        # Audit the PRODUCTION dependency tree — what actually ships in the package. Dev-only tooling
        # (typedoc / eslint and their transitive postcss / linkify-it / js-yaml / brace-expansion) is not
        # published and its advisories are handled by npm-audit-remediate.yml, so it does not gate a release.
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build
      # `tsconfig.json` covers src/** and `npm run lint` covers `eslint src`, so benchmark/ and embeds/
      # were never type-checked: a bench series with no colour rendered `fill="undefined"` bars and an
      # `orm:` label that matched no series wrote an unreadable row into the results CSV, both at exit 0.
      # The bench deps live in benchmark/package.json and @prisma/client only has types once generated.
      - name: Install benchmark deps
        run: npm ci --ignore-scripts --prefix benchmark && npm run prisma:generate --prefix benchmark
      - name: Typecheck tooling (benchmark + embeds)
        run: npm run typecheck:tools
      - name: Test
        run: npm run test:ci
      - name: Verify package contents
        run: npm pack --dry-run

  # The benchmark docs are MACHINE-GENERATED from benchmark/results/benchmark-results.csv: the tables +
  # win count in docs/*.md via embedoc, the chart via generate-chart.ts. Regenerate and fail on any diff —
  # the published numbers must always equal the measured data, never a hand-edited figure.
  #
  # `embedoc build` reports a failed embed load as a warning and exits 0, leaving every marker untouched,
  # so a plain regenerate-and-diff passes while the embeds never ran. check-bench-docs.mjs blanks the
  # regions first, making an unrendered one fail loudly instead of surviving into a clean diff.
  bench-docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Regenerate benchmark docs + chart from the CSV
        run: npm run docs:bench:check
      - name: Fail if docs/chart drifted from benchmark-results.csv
        run: |
          git diff --exit-code -- docs/ \
            || { echo "::error::Benchmark docs/chart are out of sync with benchmark/results/benchmark-results.csv. Run 'npx embedoc build && npx tsx benchmark/generate-chart.ts' and commit the result."; exit 1; }
