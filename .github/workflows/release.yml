name: GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # Go treats go/ as a subdirectory module (module path ends in /go), so
          # `go get github.com/foo-ogawa/litedbmodel/go@vX.Y.Z` only resolves a tag named
          # `go/vX.Y.Z` — the bare root `vX.Y.Z` tag is invisible to it.
          echo "gotag=go/v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check whether release tag exists
        id: tag
        continue-on-error: true
        run: git rev-parse "${{ steps.pkg.outputs.tag }}"
      - name: Stop if release already exists
        if: steps.tag.outcome == 'success'
        run: echo "Release already exists for ${{ steps.pkg.outputs.tag }}"
      - name: Install
        if: steps.tag.outcome == 'failure'
        run: npm ci --ignore-scripts
      - name: Version SSoT in lockstep (npm → PyPI/crates/Go-tag/Packagist)
        if: steps.tag.outcome == 'failure'
        run: npm run sync:versions:check
      - name: No local (../-escaping) dependencies
        if: steps.tag.outcome == 'failure'
        run: npm run deps:check
      - name: Audit
        if: steps.tag.outcome == 'failure'
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        if: steps.tag.outcome == 'failure'
        run: npm audit signatures
      - name: Lint
        if: steps.tag.outcome == 'failure'
        run: npm run lint --if-present
      - name: Build
        if: steps.tag.outcome == 'failure'
        run: npm run build
      - name: Verify package contents
        if: steps.tag.outcome == 'failure'
        run: npm pack --dry-run
      - name: Create GitHub Release
        if: steps.tag.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pkg.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.pkg.outputs.tag }}" \
            --generate-notes
      # The Go runtime ships as the subdirectory module github.com/foo-ogawa/litedbmodel/go.
      # Go's module rules resolve a versioned import ONLY via a `go/vX.Y.Z` tag, so tag the SAME
      # commit the root release points at (github.sha) — `go get .../litedbmodel/go@vX.Y.Z` then
      # serves the go/ subtree of that commit. Without this, consumers are stuck on a `@main`
      # pseudo-version. Packagist (litedbmodel/runtime) syncs off the root `vX.Y.Z` tag via its
      # repo webhook, so no dedicated PHP publish workflow is needed (see RELEASING.md).
      #
      # This step is deliberately NOT gated on the root-tag outcome: it self-heals off the REMOTE
      # existence of go/vX.Y.Z alone (present → no-op, absent → create+push), so a re-run backfills
      # a transiently-missing go tag instead of skipping it forever. The ls-remote check prevents
      # double-creation, so running every release is safe.
      - name: Tag Go submodule (go/vX.Y.Z)
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.pkg.outputs.gotag }}" >/dev/null 2>&1; then
            echo "Go tag ${{ steps.pkg.outputs.gotag }} already exists on origin — nothing to do."
            exit 0
          fi
          echo "Go tag ${{ steps.pkg.outputs.gotag }} missing on origin — creating on ${{ github.sha }} and pushing."
          git tag "${{ steps.pkg.outputs.gotag }}" "${{ github.sha }}"
          git push origin "${{ steps.pkg.outputs.gotag }}"

      # Pushing the tag is not the same as shipping the module, and for five releases it was not the
      # same thing at all: `go/go.mod` declared `…/litedbmodel/go` while the tags said v2, and Go
      # requires the module path to end in `/vN` from major 2 on, so `go get` answered
      # "invalid version: module contains a go.mod file, so module path must match major version" for
      # every one of v2.0.0 … v2.2.4 (#265). Nothing noticed, because Go is the one target with no
      # upload step — there was no job whose red would say the module is unusable, and CI's own go
      # tests run from inside the repo, where the module path is never resolved.
      #
      # So ASK THE PROXY. `@v/<version>.info` is 200 only when the module actually resolves at that
      # version; the failure mode is that one status code, which is why this can be a gate at all.
      # `GOPROXY=proxy.golang.org` + `GOFLAGS=-mod=mod` are not needed — this is a plain fetch, and the
      # request itself is what makes the proxy index the new tag.
      - name: The Go module actually resolves at this version
        run: |
          MODULE=$(awk '$1 == "module" { print $2; exit }' go/go.mod)
          URL="https://proxy.golang.org/${MODULE}/@v/v${{ steps.pkg.outputs.version }}.info"
          echo "asking the proxy: $URL"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/goproxy.out -w '%{http_code}' "$URL")
            [ "$code" = "200" ] && { echo "✓ resolves: $(cat /tmp/goproxy.out)"; exit 0; }
            echo "  attempt $attempt: HTTP $code — $(head -c 300 /tmp/goproxy.out)"
            sleep 20
          done
          echo "✗ ${MODULE}@v${{ steps.pkg.outputs.version }} does not resolve on proxy.golang.org."
          echo "  The tag is pushed but consumers cannot 'go get' it. Most likely the module path in"
          echo "  go/go.mod does not carry the /vN suffix Go requires from major 2 on (#265)."
          exit 1
